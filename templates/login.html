<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Smart Parking</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #08111f,
                    #101b30,
                    #08111f
                );

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;
        }

        .login-container {
            width: 380px;

            background: #111c35;

            border: 1px solid #26365c;

            border-radius: 16px;

            padding: 35px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.4);

            text-align: center;
        }

        .logo {
            width: 70px;
            height: 70px;

            margin: 0 auto 18px;

            border-radius: 50%;

            background: #2563eb;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 32px;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 6px;
        }

        .subtitle {
            color: #9aa8c7;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            display: block;

            font-size: 14px;

            color: #c9d4ec;

            margin-bottom: 7px;
        }

        input {
            width: 100%;

            padding: 13px 14px;

            background: #0b1529;

            border: 1px solid #26365c;

            border-radius: 8px;

            color: white;

            font-size: 15px;

            outline: none;
        }

        input:focus {
            border-color: #3b82f6;
        }

        input::placeholder {
            color: #687695;
        }

        .login-btn {
            width: 100%;

            padding: 13px;

            margin-top: 8px;

            border: none;

            border-radius: 8px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .error {
            background: rgba(220, 38, 38, 0.15);

            border: 1px solid #dc2626;

            color: #f87171;

            padding: 10px;

            border-radius: 7px;

            margin-bottom: 18px;

            font-size: 14px;
        }

        .footer {
            margin-top: 25px;

            font-size: 12px;

            color: #687695;
        }

    </style>

</head>

<body>

    <div class="login-container">

        <div class="logo">
            🅿️
        </div>

        <h1>Smart Parking</h1>

        <div class="subtitle">
            Administrator Login
        </div>

        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}

        <form method="POST" action="/login">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    required
                    autofocus
                >

            </div>

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

            </div>

            <button
                type="submit"
                class="login-btn"
            >
                LOGIN
            </button>

        </form>

        <div class="footer">
            Smart Parking Management System
        </div>

    </div>

</body>

</html>
